name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The image bundles the full toolchain (MPI, PETSc/petsc4py, MUMPS/mumps4py,
      # SuiteSparse). Building it compiles PETSc/SuiteSparse from source and is slow;
      # to speed CI up, push it to a registry once and `docker pull` it here instead.
      - name: Build the manapy environment image
        run: docker build -t manapy:ci -f Docker/Dockerfile .

      # Mount the checked-out source into the image, install manapy, and run the
      # test suite (pytest + a parallel MPI smoke test) via Docker/tests.sh.
      - name: Install manapy and run the tests
        run: |
          docker run --rm --user root \
            -v "${{ github.workspace }}:/workspace/manapy" \
            -w /workspace/manapy \
            manapy:ci \
            bash -c "python -m pip install -e . && bash Docker/tests.sh"
