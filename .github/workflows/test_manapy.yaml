name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The image bundles the full toolchain (MPI, PETSc/petsc4py, MUMPS/mumps4py)
      # and takes ~20 min to build from source. The source is mounted at run time
      # (not COPYed in), so the image only depends on Docker/Dockerfile.
      #
      # Instead of rebuilding every run (the GitHub Actions layer cache is too
      # small for this multi-GB image and gets evicted), we build the image ONCE
      # and store it in GHCR, tagged by a hash of the Dockerfile. As long as
      # Docker/Dockerfile is unchanged, later runs just `docker pull` it (~1-2 min)
      # instead of recompiling PETSc/MUMPS.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the manapy image (or reuse it from GHCR)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/manapy-ci:$(sha256sum Docker/Dockerfile | cut -c1-12)"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          if docker pull "$IMAGE" 2>/dev/null; then
            echo "Reusing cached image $IMAGE"
          else
            echo "Building image $IMAGE (Dockerfile changed or first build)"
            docker build -t "$IMAGE" -f Docker/Dockerfile .
            # Push so future runs reuse it. May fail for PRs from forks (no
            # package-write token); that is non-fatal, we still have it locally.
            docker push "$IMAGE" || echo "WARNING: could not push image to GHCR (fork PR?); continuing"
          fi

      # Mount the checked-out source into the image, install manapy, and run the
      # test suite (pytest + a parallel MPI smoke test) via Docker/tests.sh.
      # The container runs as root; the domain test fixtures spawn `mpirun`
      # subprocesses, and OpenMPI refuses to run as root unless explicitly
      # allowed. These env vars grant that (equivalent to --allow-run-as-root).
      - name: Install manapy and run the tests
        run: |
          docker run --rm --user root \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            -v "${{ github.workspace }}:/workspace/manapy" \
            -w /workspace/manapy \
            "$IMAGE" \
            bash -c "python -m pip install -e . && bash Docker/tests.sh"
