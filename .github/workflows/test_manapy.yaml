name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The image bundles the full toolchain (MPI, PETSc/petsc4py, MUMPS/mumps4py).
      # Compiling PETSc from source is slow, and the source is mounted at run time
      # (not COPYed in), so the image only changes when Docker/Dockerfile changes.
      # Cache the build layers across runs via the GitHub Actions cache: the first
      # run is slow, later runs reuse the unchanged PETSc/MUMPS layers.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the manapy environment image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Dockerfile
          tags: manapy:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mount the checked-out source into the image, install manapy, and run the
      # test suite (pytest + a parallel MPI smoke test) via Docker/tests.sh.
      - name: Install manapy and run the tests
        run: |
          docker run --rm --user root \
            -v "${{ github.workspace }}:/workspace/manapy" \
            -w /workspace/manapy \
            manapy:ci \
            bash -c "python -m pip install -e . && bash Docker/tests.sh"
