# this file shows to pytest what to collect
[pytest]
testpaths = tests
markers =
	parallel: parallel tests (run with: mpirun -n N pytest -m parallel)

# Sequential tests only (default):
#   pytest -m "not parallel"
#
# Parallel tests (requires MPI):
#   mpirun -n 2 pytest tests/test_parallel.py -m parallel
#   mpirun -n 4 pytest tests/test_parallel.py -m parallel --oversubscribe
